kind = "web"
previewPath = "/"
title = "RefMap"
description = "A focused creative reference workspace for artists, producers, and engineers to organize reference tracks, capture timestamped notes, and turn inspiration into a clear production brief."
version = "1.0.0"
id = "artifacts/refmap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22247

[services.development]
run = "pnpm --filter @workspace/refmap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/refmap", "run", "build" ]
serve = "static"
publicDir = "artifacts/refmap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22247"
BASE_PATH = "/"
